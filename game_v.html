<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가치관 눈치경매 - 뷰어</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0a; --surface: #161616; --surface2: #1e1e1e; --border: #282828;
  --text: #f0f0f0; --text2: #888;
  --accent: #39ff6a; --accent-dim: rgba(57,255,106,0.1);
  --danger: #ff4444; --danger-dim: rgba(255,68,68,0.12);
  --gold: #ffd700; --gold-dim: rgba(255,215,0,0.12);
}
html, body { height: 100%; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

.viewer-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.viewer-logo { font-size: 16px; font-weight: 700; color: var(--accent); }
.viewer-phase { font-size: 13px; color: var(--text2); background: var(--surface2); padding: 4px 14px; border-radius: 20px; }

.vscreen { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
.vscreen.active { display: flex; }

.wait-title { font-size: 48px; font-weight: 900; color: var(--accent); margin-bottom: 12px; letter-spacing: -0.04em; }
.wait-sub { font-size: 20px; color: var(--text2); margin-bottom: 3rem; }
.player-bubbles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 800px; }
.player-bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 10px 20px; font-size: 16px; font-weight: 500; }
.player-count-big { font-size: 80px; font-weight: 900; color: var(--accent); margin-top: 2rem; }
.player-count-label { font-size: 18px; color: var(--text2); }

.bet-timer { font-size: 120px; font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 16px; }
.bet-timer.urgent { color: var(--danger); animation: blink 0.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
.bet-round-label { font-size: 20px; color: var(--text2); margin-bottom: 1rem; }
.bet-progress-wrap { width: 600px; max-width: 90vw; background: var(--border); height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 2rem; }
.bet-progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 1s linear; }
.bet-submit-count { font-size: 22px; color: var(--text2); }
.bet-submit-count span { color: var(--accent); font-weight: 700; font-size: 28px; }
.bet-silence { font-size: 28px; color: var(--text2); margin-top: 1.5rem; }

.reveal-item-title { font-size: 36px; font-weight: 900; margin-bottom: 1.5rem; text-align: center; }
.reveal-result-big { text-align: center; margin-bottom: 1.5rem; }
.reveal-winner-name { font-size: 64px; font-weight: 900; color: var(--accent); line-height: 1.1; }
.reveal-winner-sub { font-size: 20px; color: var(--text2); margin-top: 8px; }
.reveal-bomb-title { font-size: 48px; font-weight: 900; color: var(--danger); }
.reveal-bomb-names { font-size: 22px; color: var(--danger); margin-top: 8px; opacity: 0.8; }
.reveal-next-label { font-size: 18px; color: var(--text2); margin-top: 1.5rem; }
.reveal-next-name { font-size: 40px; font-weight: 700; color: var(--gold); }
.reveal-no-bid { font-size: 32px; color: var(--text2); }
.reveal-bids-list { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-top: 1rem; width: 100%; max-width: 600px; }
.reveal-bid-row { display: flex; align-items: center; gap: 16px; padding: 12px 24px; border-bottom: 1px solid var(--border); }
.reveal-bid-row:last-child { border-bottom: none; }
.reveal-bid-rank { font-size: 16px; color: var(--text2); width: 40px; font-weight: 700; flex-shrink: 0; }
.reveal-bid-nick { font-size: 18px; font-weight: 700; flex: 1; }
.reveal-bid-nick.win { color: var(--accent); }
.reveal-bid-nick.bombed { color: var(--danger); text-decoration: line-through; }
.reveal-bid-nick.next { color: var(--gold); }
.reveal-bid-lp { font-size: 15px; color: var(--text2); }
.reveal-bid-lp.win { color: var(--accent); font-weight: 700; }
.reveal-bid-score { font-size: 16px; font-weight: 700; color: var(--gold); width: 80px; text-align: right; }
.reveal-current { width: 100%; max-width: 700px; display: flex; flex-direction: column; align-items: center; }
.reveal-history { margin-top: 1.5rem; width: 100%; max-width: 700px; }
.reveal-history-title { font-size: 13px; color: var(--text2); margin-bottom: 8px; font-weight: 700; }
.reveal-history-item { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 10px; padding: 8px 16px; margin-bottom: 6px; }
.rhi-name { font-size: 14px; font-weight: 700; flex: 1; }
.rhi-result { font-size: 13px; color: var(--text2); }
.rhi-result.win { color: var(--accent); }
.rhi-result.bomb { color: var(--danger); }

.ranking-title-big { font-size: 40px; font-weight: 900; color: var(--gold); margin-bottom: 2rem; }
.ranking-podium { display: flex; align-items: flex-end; gap: 1rem; margin-bottom: 2rem; }
.podium-item { display: flex; flex-direction: column; align-items: center; }
.podium-item.rank1 { order: 2; }
.podium-item.rank2 { order: 1; }
.podium-item.rank3 { order: 3; }
.podium-medal { font-size: 40px; margin-bottom: 8px; }
.podium-nick { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.podium-pts { font-size: 26px; font-weight: 900; color: var(--gold); }
.podium-block { width: 120px; border-radius: 12px 12px 0 0; margin-top: 8px; }
.podium-item.rank1 .podium-block { height: 120px; background: var(--gold); }
.podium-item.rank2 .podium-block { height: 80px; background: #808080; }
.podium-item.rank3 .podium-block { height: 60px; background: #8b4513; }
.ranking-rest { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 500px; }
.ranking-rest-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px; }
.ranking-rest-rank { font-size: 16px; color: var(--text2); width: 32px; font-weight: 700; }
.ranking-rest-nick { font-size: 18px; font-weight: 700; flex: 1; }
.ranking-rest-pts { font-size: 18px; font-weight: 700; color: var(--gold); }

.pulse-dot { width: 16px; height: 16px; background: var(--accent); border-radius: 50%; margin-top: 2rem; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }
</style>
</head>
<body>

<div class="viewer-header">
  <div class="viewer-logo">🎯 가치관 눈치경매 · 뷰어</div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="viewer-phase" id="viewerPhase">연결 중...</div>
    <button id="muteBtn" onclick="toggleMute()" style="padding:5px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">🔊 소리 켜짐</button>
  </div>
</div>

<!-- 대기 -->
<div class="vscreen active" id="vs-waiting">
  <div class="wait-title">참여자 대기 중</div>
  <div class="wait-sub">선생님이 게임을 시작할 때까지 기다려요</div>
  <div class="player-bubbles" id="playerBubbles"></div>
  <div class="player-count-big" id="playerCountBig">0</div>
  <div class="player-count-label">명 참여 중</div>
</div>

<!-- 목표 선택 -->
<div class="vscreen" id="vs-target">
  <div class="wait-title" style="font-size:36px;">🎯 목표 가치관 선택 중</div>
  <div class="wait-sub">지난 검사 결과를 참고해서 목표 매물을 선택하세요</div>
  <div class="player-count-big" style="font-size:60px;" id="targetDoneCount">0</div>
  <div class="player-count-label">명 선택 완료</div>
  <div style="margin-top:1rem;font-size:18px;color:var(--text2);" id="targetDoneSub"></div>
</div>

<!-- 배팅 -->
<div class="vscreen" id="vs-betting">
  <div class="bet-round-label" id="betRoundLabel">1라운드 · 직업가치관</div>
  <div class="bet-timer" id="betTimerBig">3:00</div>
  <div class="bet-progress-wrap">
    <div class="bet-progress-fill" id="betProgressFill" style="width:100%"></div>
  </div>
  <div class="bet-submit-count">배팅 제출: <span id="betSubmitCount">0</span>명</div>
  <div class="bet-silence">🤫 침묵</div>
</div>

<!-- 2라운드 미리보기 -->
<div class="vscreen" id="vs-preview-r2">
  <div class="wait-title" style="font-size:36px;color:#aa66ff;">2라운드 · 흥미유형 경매</div>
  <div class="wait-sub" style="margin-bottom:2rem;">내가 좋아하는 활동 유형을 경매해요!</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;max-width:900px;width:100%;">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;"><div style="font-size:20px;font-weight:700;">🔧 만들기·기술</div></div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;"><div style="font-size:20px;font-weight:700;">🔬 분석·탐구</div></div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;"><div style="font-size:20px;font-weight:700;">🌍 도전·탐험</div></div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;"><div style="font-size:20px;font-weight:700;">🎨 창작·표현</div></div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;"><div style="font-size:20px;font-weight:700;">🤝 돕기·소통</div></div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;"><div style="font-size:20px;font-weight:700;">📢 이끌기·설득</div></div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;"><div style="font-size:20px;font-weight:700;">💡 아이디어·운영</div></div>
  </div>
  <div style="margin-top:2rem;font-size:18px;color:var(--text2);">배팅 시작을 기다리는 중...</div>
</div>

<!-- 집계 중 -->
<div class="vscreen" id="vs-result-wait">
  <div class="wait-title" style="font-size:36px;">결과 집계 중...</div>
  <div class="wait-sub">잠시 후 공개됩니다</div>
  <div class="pulse-dot"></div>
</div>

<!-- 순차 공개 -->
<div class="vscreen" id="vs-revealing">
  <div class="reveal-current">
    <div class="reveal-item-title" id="revealItemTitle">-</div>
    <div class="reveal-result-big" id="revealResultBig"></div>
    <div class="reveal-bids-list" id="revealBidsList"></div>
  </div>
  <div class="reveal-history" id="revealHistory" style="display:none;">
    <div class="reveal-history-title">이전 결과</div>
    <div id="revealHistoryList"></div>
  </div>
</div>

<!-- 랭킹 -->
<div class="vscreen" id="vs-ranking">
  <div class="ranking-title-big">🏆 최종 랭킹</div>
  <div class="ranking-podium" id="rankingPodium"></div>
  <div class="ranking-rest" id="rankingRest"></div>
</div>

<script>
// ── 사운드 ──
let _ac = null;
let isMuted = false;
let _urgentInterval = null;

function _ctx() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  return _ac;
}
function _tone(freq, dur, type, vol, delay) {
  if (isMuted) return;
  type = type||'square'; vol = vol||0.25; delay = delay||0;
  try {
    const c=_ctx(),o=c.createOscillator(),g=c.createGain();
    o.connect(g); g.connect(c.destination); o.type=type;
    o.frequency.setValueAtTime(freq,c.currentTime+delay);
    g.gain.setValueAtTime(vol,c.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+delay+dur);
    o.start(c.currentTime+delay); o.stop(c.currentTime+delay+dur+0.01);
  } catch(e) {}
}
function toggleMute() {
  isMuted=!isMuted;
  const b=document.getElementById('muteBtn');
  if(b){b.textContent=isMuted?'🔇 소리 꺼짐':'🔊 소리 켜짐';b.style.opacity=isMuted?'0.5':'1';}
  if(isMuted&&_urgentInterval){clearInterval(_urgentInterval);_urgentInterval=null;}
}
function sBet() { [400,550,750].forEach((f,i)=>_tone(f,0.15,'square',0.25,i*0.13)); }
function sUrgent() { _tone(880,0.07,'square',0.2); }
function sReveal() {
  [180,220,280,360,460,580,720,900].forEach((f,i)=>_tone(f,0.05,'sawtooth',0.15,i*0.04));
  setTimeout(()=>_tone(1100,0.25,'square',0.3),380);
}
function sWin() { [[523,0],[659,0.12],[784,0.24],[1047,0.36]].forEach(([f,t])=>_tone(f,0.15,'square',0.28,t)); }
function sBomb() {
  try {
    const c=_ctx(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type='sawtooth';
    o.frequency.setValueAtTime(600,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(80,c.currentTime+0.4);
    g.gain.setValueAtTime(0.3,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.5);
    o.start();o.stop(c.currentTime+0.5);
  } catch(e){}
}
function sNoBid() { _tone(220,0.18,'square',0.15); }
function sFanfare() {
  [[523,0.12,0],[523,0.12,0.13],[523,0.12,0.26],[415,0.09,0.39],
   [523,0.12,0.48],[659,0.12,0.61],[784,0.12,0.74],[1047,0.5,0.87]
  ].forEach(([f,d,t])=>_tone(f,d,'square',0.3,t));
  setTimeout(()=>{_tone(784,0.5,'triangle',0.15);_tone(987,0.5,'triangle',0.15);},870);
}

// ── Firebase ──
const firebaseConfig = {
  apiKey: "AIzaSyAS4hYbCtSpBXUsH_ue463gCVarqbnP7WY",
  authDomain: "career-game-69c2f.firebaseapp.com",
  databaseURL: "https://career-game-69c2f-default-rtdb.firebaseio.com",
  projectId: "career-game-69c2f",
  storageBucket: "career-game-69c2f.firebasestorage.app",
  messagingSenderId: "856172881039",
  appId: "1:856172881039:web:593b5fa4d3cfa2a6e63cfa"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const V_ITEMS = [
  {id:'v1',name:'💰 보수·안정'},{id:'v2',name:'⚖️ 워라밸'},
  {id:'v3',name:'🎯 자율성'},{id:'v4',name:'😄 즐거움'},
  {id:'v5',name:'🌱 성장'},{id:'v6',name:'🔥 도전'},
  {id:'v7',name:'👑 영향력·인정'},{id:'v8',name:'🤝 관계·기여'}
];
const H_ITEMS = [
  {id:'h1',name:'🔧 만들기·기술'},{id:'h2',name:'🔬 분석·탐구'},
  {id:'h3',name:'🌍 도전·탐험'},{id:'h4',name:'🎨 창작·표현'},
  {id:'h5',name:'🤝 돕기·소통'},{id:'h6',name:'📢 이끌기·설득'},
  {id:'h7',name:'💡 아이디어·운영'}
];

let _ti=null, _lrc=0, _ci=[], _rh=[], _lp='';

function $v(id){return document.getElementById(id);}
function showVS(id){
  document.querySelectorAll('.vscreen').forEach(s=>s.classList.remove('active'));
  const e=$v('vs-'+id); if(e) e.classList.add('active');
}
function setLabel(t){ const e=$v('viewerPhase'); if(e) e.textContent=t; }

db.ref('players').on('value', snap => {
  const pl=snap.exists()?Object.values(snap.val()):[];
  const n=pl.length;
  if($v('playerCountBig')) $v('playerCountBig').textContent=n;
  if($v('playerBubbles')) $v('playerBubbles').innerHTML=pl.map(p=>`<div class="player-bubble">${p.nickname}</div>`).join('');
  const dn=pl.filter(p=>p.targets&&p.targets.length>0).length;
  if($v('targetDoneCount')) $v('targetDoneCount').textContent=dn;
  if($v('targetDoneSub')) $v('targetDoneSub').textContent=`전체 ${n}명 중 ${n-dn}명 선택 중...`;
  const r1=pl.filter(p=>p.r1bet).length,r2=pl.filter(p=>p.r2bet).length;
  // 현재 라운드에 맞는 제출 수 표시
  const submitCount = _lp==='betting_r2' ? r2 : r1;
  if($v('betSubmitCount')) $v('betSubmitCount').textContent=submitCount;
});

db.ref('gameState').on('value', snap => {
  if(!snap.exists()) return;
  onState(snap.val());
});

function onState(state) {
  const chg=state.phase!==_lp; _lp=state.phase;
  switch(state.phase) {
    case 'closed': case 'waiting':
      setLabel('대기 중'); showVS('waiting'); break;
    case 'target_select':
      setLabel('목표 선택'); showVS('target'); break;
    case 'betting_r1':
      setLabel('1라운드 배팅');
      if($v('betRoundLabel')) $v('betRoundLabel').textContent='1라운드 · 직업가치관';
      showVS('betting'); if(chg) sBet(); startTimer(state.timerEnd); break;
    case 'betting_r2':
      setLabel('2라운드 배팅');
      if($v('betRoundLabel')) $v('betRoundLabel').textContent='2라운드 · 흥미유형';
      showVS('betting'); if(chg) sBet(); startTimer(state.timerEnd); break;
    case 'preview_r2':
      setLabel('2라운드 준비');
      showVS('preview-r2'); break;
    case 'result_wait':
      setLabel('결과 집계'); stopTimer(); showVS('result-wait'); break;
    case 'revealing_r1': case 'revealing_r2':
      const rn=state.phase==='revealing_r1'?1:2;
      setLabel(rn+'라운드 결과 공개');
      _ci=rn===1?V_ITEMS:H_ITEMS;
      updateReveal(state.results||{},state.revealedCount||0);
      showVS('revealing'); break;
    case 'show_result_r1': case 'show_result_r2':
      setLabel('결과 공개 완료'); break;
    case 'ended':
      setLabel('게임 종료'); stopTimer();
      if(chg) sFanfare();
      showRanking(state.rankings||[]); break;
  }
}

function startTimer(endTime) {
  if(_ti) clearInterval(_ti);
  const tE=$v('betTimerBig'),fE=$v('betProgressFill');
  const total=180000; let wu=false;
  function tick(){
    const left=Math.max(0,endTime-Date.now());
    const min=Math.floor(left/60000),sec=Math.floor((left%60000)/1000);
    if(tE) tE.textContent=min+':'+String(sec).padStart(2,'0');
    const urg=left<=30000;
    if(tE) tE.className='bet-timer'+(urg?' urgent':'');
    if(fE) fE.style.width=(left/total*100)+'%';
    if(urg&&!wu){wu=true;sUrgent();if(_urgentInterval)clearInterval(_urgentInterval);_urgentInterval=setInterval(()=>sUrgent(),1000);}
    if(left<=0) stopTimer();
  }
  tick(); _ti=setInterval(tick,500);
}
function stopTimer(){
  if(_ti){clearInterval(_ti);_ti=null;}
  if(_urgentInterval){clearInterval(_urgentInterval);_urgentInterval=null;}
}

function updateReveal(results,revealedCount){
  if(revealedCount===0){
    _rh=[];_lrc=0;
    if($v('revealHistoryList')) $v('revealHistoryList').innerHTML='';
    if($v('revealHistory')) $v('revealHistory').style.display='none';
    if($v('revealItemTitle')) $v('revealItemTitle').textContent='곧 공개됩니다...';
    if($v('revealResultBig')) $v('revealResultBig').innerHTML='';
    if($v('revealBidsList')) $v('revealBidsList').innerHTML='';
    return;
  }
  if(revealedCount<=_lrc) return;
  const idx=revealedCount-1,item=_ci[idx];
  if(!item) return;
  const r=results[item.id];

  if(_lrc>0&&idx>0){
    const pi=_ci[idx-1],pr=results[pi?pi.id:null];
    let res='입찰 없음',cls='';
    if(pr){if(pr.bombed){res='💥 폭사';cls='bomb';}else if(pr.winner){res=`🏆 ${pr.winner} (${pr.score||pr.nextScore||0}점)`;cls='win';}}
    _rh.unshift({name:pi?pi.name:'-',res,cls});
    if(_rh.length>3) _rh.pop();
    if($v('revealHistoryList')) $v('revealHistoryList').innerHTML=_rh.map(h=>`<div class="reveal-history-item"><span class="rhi-name">${h.name}</span><span class="rhi-result ${h.cls}">${h.res}</span></div>`).join('');
    if($v('revealHistory')) $v('revealHistory').style.display='block';
  }

  setTimeout(()=>sReveal(),50);
  if($v('revealItemTitle')) $v('revealItemTitle').textContent=item.name;

  if(!r||(!r.winner&&!r.bombed)){
    sNoBid();
    if($v('revealResultBig')) $v('revealResultBig').innerHTML='<div class="reveal-no-bid">입찰자가 없어요</div>';
    if($v('revealBidsList')) $v('revealBidsList').innerHTML='';
  } else if(r.bombed){
    setTimeout(()=>sBomb(),400);
    const names=(r.bombedPlayers||[]).join(', ');
    if($v('revealResultBig')) $v('revealResultBig').innerHTML=`
      <div class="reveal-bomb-title">💥 동점 폭사!</div>
      <div class="reveal-bomb-names">${names}</div>
      ${r.nextWinner?`<div class="reveal-next-label">차순위 낙찰 →</div><div class="reveal-next-name">${r.nextWinner} (${r.nextScore||0}점)</div>`:'<div class="reveal-next-label" style="color:var(--danger)">낙찰자 없음</div>'}`;
    const bs=new Set(r.bombedPlayers||[]);
    if($v('revealBidsList')) $v('revealBidsList').innerHTML=(r.allBids||[]).slice(0,10).map((b,i)=>{
      const ib=bs.has(b.nick),in_=b.nick===r.nextWinner;
      return `<div class="reveal-bid-row"><span class="reveal-bid-rank">${i===0?'👑':(i+1)+'위'}</span><span class="reveal-bid-nick${ib?' bombed':in_?' next':''}">${b.nick}</span><span class="reveal-bid-lp">${b.amount}LP</span><span class="reveal-bid-score">${in_?(r.nextScore||0)+'점':ib?'💥':'−'}</span></div>`;
    }).join('')+((r.allBids||[]).length>10?`<div style="padding:8px 24px;font-size:13px;color:var(--text2);">외 ${(r.allBids||[]).length-10}명 더...</div>`:'');
  } else {
    setTimeout(()=>sWin(),500);
    const tag=r.isTarget?' ⭐':'';
    if($v('revealResultBig')) $v('revealResultBig').innerHTML=`
      <div class="reveal-winner-name">${r.winner}${tag}</div>
      <div class="reveal-winner-sub">${r.score}점 (50점 + ${r.amount}LP${r.isTarget?' + 목표보너스':''})</div>`;
    if($v('revealBidsList')) $v('revealBidsList').innerHTML=(r.allBids||[]).slice(0,10).map((b,i)=>{
      const iw=b.nick===r.winner;
      return `<div class="reveal-bid-row"><span class="reveal-bid-rank">${i===0?'🏆':(i+1)+'위'}</span><span class="reveal-bid-nick${iw?' win':''}">${b.nick}</span><span class="reveal-bid-lp${iw?' win':''}">${b.amount}LP</span><span class="reveal-bid-score">${iw?r.score+'점':'−'}</span></div>`;
    }).join('')+((r.allBids||[]).length>10?`<div style="padding:8px 24px;font-size:13px;color:var(--text2);">외 ${(r.allBids||[]).length-10}명 더...</div>`:'');
  }
  _lrc=revealedCount;
}

function showRanking(rankings){
  showVS('ranking');
  const medals=['🥇','🥈','🥉'],top3=rankings.slice(0,3),rest=rankings.slice(3);
  if($v('rankingPodium')) $v('rankingPodium').innerHTML=top3.map((r,i)=>`
    <div class="podium-item rank${i+1}">
      <div class="podium-medal">${medals[i]||''}</div>
      <div class="podium-nick">${r.nick}</div>
      <div class="podium-pts">${r.total}점</div>
      <div class="podium-block"></div>
    </div>`).join('');
  if($v('rankingRest')) $v('rankingRest').innerHTML=rest.map((r,i)=>`
    <div class="ranking-rest-row">
      <span class="ranking-rest-rank">${i+4}위</span>
      <span class="ranking-rest-nick">${r.nick}</span>
      <span class="ranking-rest-pts">${r.total}점</span>
    </div>`).join('');
}
</script>
