<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다중지능 검사</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf8f4;
  --panel: #ffffff;
  --border: #e8e0d4;
  --accent: #8b6f4e;
  --accent2: #c4956a;
  --accent3: #5a8a6e;
  --text: #2c2416;
  --text2: #7a6a58;
  --gold: #c4956a;
  --green: #5a8a6e;
  --shadow: rgba(139,111,78,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { overscroll-behavior-y: contain; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* 공통 */
.screen { display:none; }
.screen.active { display:block; }
.container { max-width:720px; margin:0 auto; padding:24px 18px 80px; }

/* 헤더 */
.app-header {
  background: var(--accent);
  color: white;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 8px var(--shadow);
}
.app-header-title { font-size:15px; font-weight:700; }
.app-header-sub { font-size:11px; opacity:0.8; }

/* 진행바 */
.progress-bar-wrap { background: rgba(255,255,255,0.25); height:4px; border-radius:2px; margin-top:8px; }
.progress-bar-fill { height:100%; background:white; border-radius:2px; transition: width 0.4s; }

/* 인트로 */
.intro-card {
  background: var(--panel);
  border-radius: 20px;
  padding: 36px 28px;
  text-align: center;
  box-shadow: 0 4px 20px var(--shadow);
  margin-top: 24px;
}
.intro-icon { font-size: 56px; margin-bottom: 16px; display:block; }
.intro-title {
  font-family: 'Gowun Batang', serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 8px;
}
.intro-sub { font-size: 14px; color: var(--text2); line-height: 1.8; margin-bottom: 28px; }
.intro-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 28px;
}
.info-box {
  background: var(--bg);
  border-radius: 12px;
  padding: 14px;
  border: 1.5px solid var(--border);
}
.info-box-num { font-size: 22px; font-weight: 900; color: var(--accent); }
.info-box-label { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* 버튼 */
.btn-primary {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 16px 32px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
  box-shadow: 0 4px 12px var(--shadow);
}
.btn-primary:hover { background: #7a5f40; transform: translateY(-1px); }
.btn-secondary {
  background: var(--bg);
  color: var(--accent);
  border: 2px solid var(--accent);
  border-radius: 12px;
  padding: 13px 24px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
}
.btn-secondary:hover { background: var(--accent); color: white; }

/* 문항 카드 */
.q-section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent3);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 6px;
  margin-top: 28px;
}
.q-counter {
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 18px;
}
.q-card {
  background: var(--panel);
  border-radius: 16px;
  padding: 22px 20px;
  margin-bottom: 12px;
  border: 2px solid var(--border);
  transition: border-color 0.2s;
}
.q-card.answered { border-color: var(--accent3); }
.q-num {
  font-size: 10px;
  font-weight: 700;
  color: var(--text2);
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.q-text {
  font-size: 15px;
  line-height: 1.7;
  color: var(--text);
  margin-bottom: 16px;
  font-weight: 500;
}
.scale-wrap {
  display: flex;
  gap: 6px;
}
.scale-btn {
  flex: 1;
  border: 2px solid var(--border);
  background: var(--bg);
  border-radius: 10px;
  padding: 10px 4px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  color: var(--text2);
  transition: all 0.15s;
  font-family: 'Noto Sans KR', sans-serif;
  text-align: center;
}
.scale-btn:hover { border-color: var(--accent2); color: var(--accent); }
.scale-btn.selected {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.scale-label {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  font-size: 10px;
  color: var(--text2);
}

/* 하단 네비 */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--panel);
  border-top: 2px solid var(--border);
  padding: 12px 18px;
  display: flex;
  gap: 10px;
  z-index: 50;
}

/* 결과 */
.result-header {
  text-align: center;
  padding: 32px 0 20px;
}
.result-title {
  font-family: 'Gowun Batang', serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 6px;
}
.result-sub { font-size: 13px; color: var(--text2); }
.result-card {
  background: var(--panel);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 12px;
  border: 2px solid var(--border);
  box-shadow: 0 2px 8px var(--shadow);
}
.result-type-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.result-score-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
}
.result-score-label { font-size: 11px; color: var(--text2); width: 70px; flex-shrink:0; }
.result-bar-bg {
  flex: 1;
  height: 10px;
  background: var(--border);
  border-radius: 5px;
  overflow: hidden;
}
.result-bar-fill {
  height: 100%;
  border-radius: 5px;
  transition: width 0.8s ease;
}
.result-score-val {
  font-size: 13px;
  font-weight: 700;
  width: 32px;
  text-align: right;
}
.rank-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  margin-left: auto;
}

/* 유형별 설명 */
.type-card {
  background: var(--panel);
  border-radius: 16px;
  padding: 22px 20px;
  margin-bottom: 14px;
  border: 2px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
}
.type-card:hover { border-color: var(--accent2); }
.type-card.open { border-color: var(--accent); }
.type-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
}
.type-card-name { font-size: 16px; font-weight: 700; flex: 1; }
.type-card-arrow { font-size: 16px; transition: transform 0.2s; color: var(--text2); }
.type-card.open .type-card-arrow { transform: rotate(180deg); }
.type-card-body { display: none; margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px; }
.type-card.open .type-card-body { display: block; }
.type-desc { font-size: 14px; line-height: 1.8; color: var(--text); margin-bottom: 14px; }
.type-section-title { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing:2px; margin-bottom: 6px; }
.type-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.type-tag {
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 12px;
  color: var(--text2);
}

/* 탭 */
.tab-wrap {
  display: flex;
  gap: 0;
  background: var(--border);
  border-radius: 12px;
  padding: 3px;
  margin-bottom: 20px;
}
.tab-btn {
  flex: 1;
  background: none;
  border: none;
  border-radius: 10px;
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text2);
  cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
}
.tab-btn.active { background: var(--panel); color: var(--accent); box-shadow: 0 1px 4px var(--shadow); }

/* 경고 */
.alert-box {
  background: rgba(196,149,106,0.1);
  border: 1.5px solid var(--accent2);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 13px;
  color: var(--accent);
  margin-bottom: 16px;
  text-align: center;
}

/* 상위 순위 */
.top-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
  margin-left: 6px;
}

@media(max-width:480px) {
  .scale-btn { font-size:11px; padding:9px 2px; }
  .intro-info { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<!-- 앱 헤더 -->
<div class="app-header" id="app-header" style="display:none;">
  <div style="flex:1;">
    <div class="app-header-title" id="header-title">다중지능 검사</div>
    <div class="app-header-sub" id="header-sub">문항에 솔직하게 응답해주세요</div>
    <div class="progress-bar-wrap" id="progress-wrap" style="display:none;">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>
</div>

<!-- SCREEN 0: 인트로 -->
<div id="screen-intro" class="screen active">
  <div class="container">
    <div class="intro-card">
      <span class="intro-icon">🧠</span>
      <div class="intro-title">다중지능 검사</div>
      <div class="intro-sub">
        하워드 가드너의 다중지능이론을 바탕으로<br>
        나의 강점 지능을 발견해보세요!<br>
        솔직하게 응답할수록 정확한 결과가 나와요.
      </div>
      <div class="intro-info">
        <div class="info-box">
          <div class="info-box-num">56문항</div>
          <div class="info-box-label">다중지능 검사</div>
        </div>
        <div class="info-box">
          <div class="info-box-num">32문항</div>
          <div class="info-box-label">보조검사</div>
        </div>
        <div class="info-box">
          <div class="info-box-num">1~5점</div>
          <div class="info-box-label">다중지능 척도</div>
        </div>
        <div class="info-box">
          <div class="info-box-num">1~7점</div>
          <div class="info-box-label">보조검사 척도</div>
        </div>
      </div>
      <button class="btn-primary" onclick="startTest1()">🚀 검사 시작하기</button>
    </div>

    <!-- 유형별 설명 바로가기 -->
    <div style="margin-top:20px;text-align:center;">
      <button class="btn-secondary" onclick="showTypeScreen()">📖 유형별 설명 보기</button>
    </div>
  </div>
</div>

<!-- SCREEN 1: 다중지능 검사 -->
<div id="screen-test1" class="screen">
  <div class="container" id="test1-container"></div>
  <div class="bottom-nav">
    <button class="btn-secondary" onclick="goIntro()" style="flex:none;padding:13px 18px;">← 처음</button>
    <button class="btn-primary" onclick="finishTest1()" id="btn-finish1">보조검사로 →</button>
  </div>
</div>

<!-- SCREEN 2: 보조검사 -->
<div id="screen-test2" class="screen">
  <div class="container" id="test2-container"></div>
  <div class="bottom-nav">
    <button class="btn-secondary" onclick="goTest1()" style="flex:none;padding:13px 18px;">← 이전</button>
    <button class="btn-primary" onclick="finishTest2()">결과 보기 →</button>
  </div>
</div>

<!-- SCREEN 3: 결과 -->
<div id="screen-result" class="screen">
  <div class="container">
    <div class="result-header">
      <div class="result-title">나의 다중지능 결과</div>
      <div class="result-sub">검사 결과를 활동지에 옮겨 적어보세요</div>
    </div>

    <div class="tab-wrap">
      <button class="tab-btn active" onclick="showTab('tab-result', this)">📊 검사 결과</button>
      <button class="tab-btn" onclick="showTab('tab-type', this)">📖 유형별 설명</button>
    </div>

    <div id="tab-result">
      <div id="result-content"></div>
      <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn-primary" onclick="goIntro()">🔄 다시 검사하기</button>
      </div>
    </div>

    <div id="tab-type" style="display:none;">
      <div id="type-content-result"></div>
    </div>
  </div>
</div>

<!-- SCREEN 4: 유형별 설명 -->
<div id="screen-type" class="screen">
  <div class="container">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
      <button onclick="goIntro()" style="background:none;border:none;font-size:20px;cursor:pointer;">←</button>
      <div>
        <div style="font-size:18px;font-weight:700;color:var(--accent);">유형별 설명</div>
        <div style="font-size:12px;color:var(--text2);">8가지 다중지능 영역을 알아보세요</div>
      </div>
    </div>
    <div id="type-content-main"></div>
  </div>
</div>

// ============================================================

// ============================================================
function calcAndShowResult() {
  // 1. 다중지능 합계 (유형별 7문항 합산, 범위 7~35)
  const sum1 = {};
  TYPES.forEach(t => { sum1[t.key] = 0; });
  QUESTIONS.forEach(q => { sum1[q.type] += answers1[q.no] || 0; });

  // 2. 환산점수 (합계-7 → CONVERT 인덱스)
  const converted = {};
  TYPES.forEach(t => {
    const s = sum1[t.key];
    const idx = Math.max(0, Math.min(28, s - 7));
    converted[t.key] = CONVERT[idx];
  });

  // 3. 보조검사 합계 (유형별 4문항 합산, 범위 4~28)
  const sum2 = {};
  TYPES.forEach(t => { sum2[t.key] = 0; });
  SUB_QUESTIONS.forEach(q => { sum2[q.type] += answers2[q.no] || 0; });

  // 4. 보조검사 환산 (4~28 → 0~100)
  const converted2 = {};
  TYPES.forEach(t => {
    converted2[t.key] = Math.round(((sum2[t.key] - 4) / 24) * 100);
  });

  // 결과 렌더링
  renderResult(sum1, converted, sum2, converted2);
  updateHeader('나의 검사 결과', '활동지에 점수를 옮겨 적어보세요', false, 0, 0);
  showScreen('result');
}

function renderResult(sum1, converted, sum2, converted2) {
  // 환산점수 기준 순위 정렬
  const ranked = TYPES.map(t => ({
    ...t,
    sum: sum1[t.key],
    conv: converted[t.key],
    subSum: sum2[t.key],
    subConv: converted2[t.key]
  })).sort((a,b) => b.conv - a.conv);

  let html = '';

  // ── 강점 TOP 2 ──
  html += `<div style="background:var(--bg);border:2px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;">
    <div style="font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:2px;margin-bottom:10px;">🏆 나의 강점 지능 TOP 2</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">`;
  ranked.slice(0,2).forEach((t) => {
    html += `<div style="flex:1;min-width:120px;background:${t.color}18;border:2px solid ${t.color}55;border-radius:12px;padding:14px;text-align:center;">
      <div style="font-size:24px;margin-bottom:6px;">${t.name.split(' ')[0]}</div>
      <div style="font-size:13px;font-weight:700;color:${t.color};">${t.name.slice(2)}</div>
      <div style="font-size:20px;font-weight:900;color:${t.color};margin-top:4px;">${t.conv}점</div>
      <div style="font-size:10px;color:var(--text2);">환산점수</div>
    </div>`;
  });
  html += `</div>`;

  // ── 보완 하위 2개 ──
  const bottom2 = ranked.slice(-2).reverse();
  html += `<div style="margin-top:12px;">
    <div style="font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1px;margin-bottom:8px;">📌 보완이 필요한 영역</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">`;
  bottom2.forEach((t) => {
    html += `<div style="flex:1;min-width:100px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;">
      <span style="font-size:18px;">${t.name.split(' ')[0]}</span>
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--text2);">${t.name.slice(2)}</div>
        <div style="font-size:13px;font-weight:900;color:var(--text2);">${t.conv}점</div>
      </div>
    </div>`;
  });
  html += `</div></div></div>`;

  // ── 전체 결과표 ──
  html += `<div style="font-size:11px;font-weight:700;color:var(--text2);letter-spacing:2px;margin-bottom:12px;margin-top:4px;">📊 전체 결과</div>`;

  ranked.forEach((t, i) => {
    const rankLabel = `${i+1}위`;
    html += `<div class="result-card">
      <div class="result-type-name">
        <span>${t.name}</span>
        <span class="top-badge" style="background:${t.color}22;color:${t.color};font-size:10px;">${rankLabel}</span>
      </div>
      <div class="result-score-row">
        <div class="result-score-label">환산점수</div>
        <div class="result-bar-bg">
          <div class="result-bar-fill" style="width:${t.conv}%;background:${t.color};"></div>
        </div>
        <div class="result-score-val" style="color:${t.color};">${t.conv}</div>
      </div>
      <div class="result-score-row">
        <div class="result-score-label">보조검사 합계</div>
        <div class="result-bar-bg">
          <div class="result-bar-fill" style="width:${Math.round(t.subSum/28*100)}%;background:${t.color};opacity:0.6;"></div>
        </div>
        <div class="result-score-val" style="color:${t.color};">${t.subSum}</div>
      </div>
    </div>`;
  });

  // ── 활동지 안내 ──
  html += `<div style="background:rgba(90,138,110,0.08);border:1.5px solid rgba(90,138,110,0.3);border-radius:12px;padding:16px;margin-top:8px;font-size:13px;color:var(--green);line-height:1.8;">
    ✅ <strong>활동지 작성 안내</strong><br>
    활동지 2번 표에 <strong>다중지능 환산점수</strong>와 <strong>보조검사 합계점수</strong>를 모두 옮겨 적어보세요!
  </div>`;

  document.getElementById('result-content').innerHTML = html;
}

let testStarted = false;

function pushDummy() {
  history.pushState({page:'test'}, '', window.location.href);
}

window.addEventListener('popstate', function() {
  if(testStarted) {
    pushDummy();
    setTimeout(function() {
      const leave = confirm('검사를 종료하고 나가시겠어요?\n지금까지의 응답이 모두 사라져요.');
      if(leave) {
        testStarted = false;
        history.back();
      } else {
        pushDummy();
      }
    }, 50);
  }
});

// 풀다운 새로고침 방지
let lastTouchY = 0;
document.addEventListener('touchstart', e => { lastTouchY = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchmove', function(e) {
  const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
  if(scrollTop === 0 && e.touches[0].clientY > lastTouchY && testStarted) {
    e.preventDefault();
  }
}, {passive:false});

// 새로고침/탭 닫기 경고
window.addEventListener('beforeunload', function(e) {
  if(testStarted) { e.preventDefault(); e.returnValue = ''; }
});
</script>
</body>
