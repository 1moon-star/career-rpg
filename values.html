<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>직업가치관 검사</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f6f2;
  --surface: #ffffff;
  --border: #e2e0d8;
  --border-strong: #c8c5bb;
  --text-primary: #1a1917;
  --text-secondary: #6b6860;
  --text-muted: #a09d97;
  --accent: #2d5a3d;
  --accent-light: #e8f0eb;
  --accent-mid: #4a7c5e;
}
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; }

/* ── COVER ── */
#coverScreen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.5rem; text-align: center; }
.cover-badge { display: inline-block; background: var(--accent-light); color: var(--accent); font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 20px; margin-bottom: 1.5rem; letter-spacing: 0.04em; }
.cover-title { font-size: 32px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.04em; margin-bottom: 12px; line-height: 1.2; }
.cover-sub { font-size: 15px; color: var(--text-secondary); line-height: 1.75; max-width: 480px; margin-bottom: 2.5rem; }
.cover-meta { display: flex; gap: 24px; justify-content: center; margin-bottom: 2.5rem; }
.cover-meta-item .num { font-size: 22px; font-weight: 700; color: var(--accent); }
.cover-meta-item .label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.start-btn { padding: 15px 48px; background: var(--accent); color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; transition: background 0.15s; }
.start-btn:hover { background: var(--accent-mid); }
.cover-source { font-size: 11px; color: var(--text-muted); margin-top: 2rem; max-width: 480px; line-height: 1.6; }

/* ── HEADER ── */
.page-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.9rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.page-header-title { font-size: 15px; font-weight: 700; color: var(--accent); }
.progress-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.progress-bar { width: 160px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s ease; }
.progress-text { font-size: 11px; color: var(--text-muted); }

/* ── SURVEY ── */
#surveyScreen { display: none; }
.container { max-width: 720px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }
.section-chip { display: inline-flex; align-items: center; background: var(--accent-light); color: var(--accent); font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 20px; margin-bottom: 1.25rem; }
.question-block { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem 1.5rem; margin-bottom: 10px; transition: border-color 0.2s; }
.question-block.answered { border-color: var(--border-strong); }
.q-num { font-size: 11px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.05em; margin-bottom: 6px; }
.q-text { font-size: 14px; color: var(--text-primary); line-height: 1.65; margin-bottom: 1rem; }
.likert-row { display: flex; gap: 5px; }
.likert-btn { flex: 1; padding: 9px 2px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); cursor: pointer; font-size: 11px; font-family: 'Noto Sans KR', sans-serif; color: var(--text-secondary); text-align: center; line-height: 1.35; transition: all 0.15s; white-space: pre-line; }
.likert-btn:hover { border-color: var(--accent-mid); background: var(--accent-light); color: var(--accent); }
.likert-btn.selected { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 700; }
.nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }
.btn { padding: 11px 28px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); cursor: pointer; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; color: var(--text-primary); font-weight: 500; transition: all 0.15s; }
.btn:hover { background: var(--bg); }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
.btn-primary:hover { background: var(--accent-mid); border-color: var(--accent-mid); }
.btn-primary:disabled { background: var(--border-strong); border-color: var(--border-strong); cursor: not-allowed; }

/* ── RESULT ── */
#resultScreen { display: none; }
.tab-bar { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 57px; z-index: 9; }
.tab-btn { flex: 1; padding: 12px 8px; background: none; border: none; border-bottom: 2px solid transparent; font-size: 13px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; color: var(--text-muted); cursor: pointer; transition: all 0.15s; text-align: center; }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.result-section { margin-bottom: 2rem; }
.section-title { font-size: 12px; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 1rem; }

.top3-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.top3-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem 1rem; text-align: center; }
.top3-card.rank1 { border-color: var(--accent); border-width: 2px; }
.rank-badge { font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; }
.rank1 .rank-badge { color: var(--accent); }
.rank-name { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
.rank-score { font-size: 24px; font-weight: 700; color: var(--text-primary); }
.rank1 .rank-score { color: var(--accent); }

.result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; }
.score-rows { display: flex; flex-direction: column; gap: 10px; }
.score-row { display: flex; align-items: center; gap: 10px; }
.score-label { font-size: 13px; color: var(--text-primary); width: 92px; flex-shrink: 0; }
.score-bar-wrap { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.score-bar-fill { height: 100%; background: var(--border-strong); border-radius: 4px; transition: width 0.7s ease; }
.score-bar-fill.top { background: var(--accent); }
.score-num { font-size: 13px; color: var(--text-secondary); width: 28px; text-align: right; font-weight: 500; }

/* Type card (result tab) */
.my-type-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.my-type-header { background: var(--accent-light); padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); }
.my-type-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.my-type-label { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; }
.my-type-name { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: -0.02em; }
.my-type-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.75; }
.my-type-pills { display: flex; gap: 6px; flex-wrap: wrap; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); }
.type-pill { font-size: 12px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); color: var(--text-secondary); background: var(--bg); font-weight: 500; }
.perspective-block { padding: 1rem 1.5rem 1.5rem; }
.perspective-label { font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.04em; margin-bottom: 10px; }
.perspective-item { padding: 10px 12px; background: var(--bg); border-radius: 10px; margin-bottom: 6px; }
.perspective-job { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 3px; }
.perspective-text { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }

/* ── TAB2: 가치관 & 유형 안내 ── */
.value-cards { display: flex; flex-direction: column; gap: 8px; }
.value-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.value-card-toggle { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; cursor: pointer; transition: background 0.15s; }
.value-card-toggle:hover { background: var(--bg); }
.value-card-name { font-size: 15px; font-weight: 700; color: var(--accent); }
.value-card-arrow { font-size: 11px; color: var(--text-muted); transition: transform 0.2s; flex-shrink: 0; margin-left: 8px; }
.value-card-arrow.open { transform: rotate(180deg); }
.value-card-body { display: none; padding: 0 1.25rem 1.1rem; border-top: 1px solid var(--border); }
.value-card-body.open { display: block; }
.value-card-def { font-size: 12px; font-weight: 700; color: var(--text-muted); margin: 10px 0 6px; letter-spacing: 0.02em; }
.value-card-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }

.type-guide-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
.type-guide-toggle { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; background: var(--accent-light); cursor: pointer; transition: opacity 0.15s; }
.type-guide-toggle:hover { opacity: 0.85; }
.type-guide-toggle-left { flex: 1; }
.type-guide-toggle-arrow { font-size: 11px; color: var(--accent); flex-shrink: 0; margin-left: 8px; transition: transform 0.2s; }
.type-guide-toggle-arrow.open { transform: rotate(180deg); }
.type-guide-body-wrap { display: none; }
.type-guide-body-wrap.open { display: block; }
.type-guide-name { font-size: 18px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.type-guide-keys { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.type-guide-key { font-size: 11px; padding: 3px 10px; border-radius: 20px; border: 1px solid rgba(45,90,61,0.3); color: var(--accent); background: rgba(255,255,255,0.6); font-weight: 700; }
.type-guide-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.75; }
.type-guide-body { padding: 1.25rem 1.5rem; }
.type-jobs-label { font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.04em; margin-bottom: 10px; }
.job-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.job-tag { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: var(--accent-light); color: var(--accent); font-weight: 500; border: 1px solid rgba(45,90,61,0.2); }
.job-tag-more { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: var(--bg); color: var(--text-muted); font-weight: 500; border: 1px solid var(--border); cursor: pointer; }
.jobs-hidden { display: none; }

.reset-row { text-align: center; margin-top: 1.5rem; }
.reset-btn { font-size: 13px; color: var(--text-muted); background: none; border: none; cursor: pointer; text-decoration: underline; font-family: 'Noto Sans KR', sans-serif; }

@media (max-width: 600px) {
  .cover-title { font-size: 24px; }
  .likert-btn { font-size: 10px; padding: 7px 1px; }
  .progress-bar { width: 100px; }
  .tab-btn { font-size: 12px; padding: 10px 4px; }
}
</style>
</head>
<body>

<!-- COVER -->
<div id="coverScreen">
  <div class="cover-badge">진로와 직업 · 자기탐색 활동</div>
  <h1 class="cover-title">직업가치관 검사</h1>
  <p class="cover-sub">내가 직업을 통해 진짜 원하는 것은 무엇일까요?<br>12가지 직업가치관 중 나에게 가장 중요한 것을 알아봐요.</p>
  <div class="cover-meta">
    <div class="cover-meta-item"><div class="num">48</div><div class="label">문항</div></div>
    <div class="cover-meta-item"><div class="num">6</div><div class="label">페이지</div></div>
    <div class="cover-meta-item"><div class="num">약 10분</div><div class="label">소요시간</div></div>
  </div>
  <button class="start-btn" onclick="startSurvey()">검사 시작하기 →</button>
  <p class="cover-source">출처: 한국청소년상담복지개발원 · 직업가치관 검사 활용도움서 (고등학생용, 2019) · 교육부 · 울산광역시교육청<br>수업 내 교육 목적으로만 활용됩니다.</p>
</div>

<!-- SURVEY -->
<div id="surveyScreen">
  <div class="page-header">
    <div class="page-header-title">직업가치관 검사</div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <span class="progress-text" id="progressText">1 / 6 페이지</span>
    </div>
  </div>
  <div class="container">
    <div class="section-chip" id="sectionChip"></div>
    <div id="questionsContainer"></div>
    <div class="nav-row">
      <button class="btn" id="prevBtn" onclick="changePage(-1)">이전</button>
      <button class="btn btn-primary" id="nextBtn" onclick="changePage(1)">다음</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="resultScreen">
  <div class="page-header">
    <div class="page-header-title">직업가치관 검사 결과</div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
      <span class="progress-text">검사 완료</span>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('myResult')">내 결과</button>
    <button class="tab-btn" onclick="switchTab('guide')">가치관 · 유형 안내</button>
  </div>

  <!-- TAB1: 내 결과 -->
  <div class="tab-content active" id="tab-myResult">
    <div class="container">
      <div class="result-section">
        <div class="section-title">상위 3개 가치관</div>
        <div class="top3-grid" id="top3Grid"></div>
      </div>
      <div class="result-section">
        <div class="section-title">12가지 가치관 점수</div>
        <div class="result-card"><div class="score-rows" id="allScores"></div></div>
      </div>
      <div class="result-section">
        <div class="section-title">나의 가치지향 유형</div>
        <div class="my-type-card" id="myTypeCard"></div>
      </div>
      <div class="reset-row">
        <button class="reset-btn" onclick="resetSurvey()">처음부터 다시하기</button>
      </div>
    </div>
  </div>

  <!-- TAB2: 가치관 & 유형 안내 -->
  <div class="tab-content" id="tab-guide">
    <div class="container">
      <div class="result-section">
        <div class="section-title">12가지 직업가치관 설명</div>
        <div class="value-cards" id="valueCards"></div>
      </div>
      <div class="result-section" style="margin-top:2.5rem;">
        <div class="section-title">4가지 가치지향 유형</div>
        <div id="typeGuideCards"></div>
      </div>
    </div>
  </div>
</div>

<script>
const VALUES = [
  {id:'stability', name:'안정성', def:'내가 하고 싶은 일을 지속적이고 안정적으로 하는 것', desc:'안정성 가치가 높을수록 내가 하고 싶은 일을 계속해서 안정적으로 하는 것을 중요하게 여깁니다. 재정적·고용적으로 안정된 환경과 정년 보장을 중시해요.', type:'stable'},
  {id:'salary',    name:'보수',   def:'일을 통해 경제적 보상을 얻는 것', desc:'보수 가치가 높을수록 일을 통해 돈과 같은 경제적 보상을 얻는 것을 중요하게 여깁니다. 성과에 대한 적절한 경제적 보상이 일의 동기가 돼요.', type:'stable'},
  {id:'balance',   name:'일과 삶의 균형', def:'일과 개인생활에 균형을 이루는 것', desc:'일과 삶의 균형 가치가 높을수록 일과 개인생활의 균형을 이루는 것을 중요하게 여깁니다. 충분한 휴식과 여가를 통해 삶의 질을 유지하고자 해요.', type:'stable'},
  {id:'fun',       name:'즐거움', def:'일 자체에 흥미를 느끼고 즐거움을 얻는 것', desc:'즐거움 가치가 높을수록 일에서 흥미와 보람을 느끼고 즐거움을 얻는 것을 중요하게 여깁니다. 하는 일 자체가 재미있고 행복해야 한다고 생각해요.', type:'meaning'},
  {id:'belong',    name:'소속감', def:'사람들과 함께 일하면서 구성원이 되는 것', desc:'소속감 가치가 높을수록 사람들과 함께 일하면서 구성원이 되는 것을 중요하게 여깁니다. 좋은 동료 관계와 팀워크를 통해 존재감을 느끼고자 해요.', type:'meaning'},
  {id:'growth',    name:'자기계발', def:'일을 통해서 자신의 능력을 발전시키고 성장해 가는 것', desc:'자기계발 가치가 높을수록 일을 통해서 자신의 능력을 발전시키고 성장해 나가는 것을 중요하게 여깁니다. 끊임없이 배우고 역량을 키워가는 과정을 중시해요.', type:'meaning'},
  {id:'challenge', name:'도전성', def:'새로운 일에 도전하는 것', desc:'도전성 가치가 높을수록 실패를 두려워하지 않고 새로운 일에 도전하는 것을 중요하게 여깁니다. 변화 가능성이 있는 일과 다양한 시도를 통해 성장하고자 해요.', type:'change'},
  {id:'influence', name:'영향력', def:'다른 사람에게 영향력을 발휘하고 이끄는 것', desc:'영향력 가치가 높을수록 다른 사람에게 영향을 미치고 사람들을 이끄는 것을 중요하게 여깁니다. 리더 역할을 하며 조직과 사람들에게 방향을 제시하고 싶어해요.', type:'change'},
  {id:'contribute',name:'사회적 기여', def:'타인이나 공동체의 복지(행복, 안녕)에 기여하는 것', desc:'사회적 기여 가치가 높을수록 다른 사람들의 행복과 복지에 기여하는 것을 중요하게 여깁니다. 나의 이익보다 사회에 도움이 되는 일을 하고자 해요.', type:'change'},

const LABELS = ['전혀\n그렇지\n않다','그렇지\n않다','보통\n이다','그렇다','매우\n그렇다'];
const PAGE_SIZE = 8;
const TOTAL_PAGES = Math.ceil(QUESTIONS.length / PAGE_SIZE);
let currentPage = 0;
let answers = {};

// ── 뒤로가기 방지 ──
history.pushState(null, '', location.href);
window.addEventListener('popstate', function() {
  history.pushState(null, '', location.href);
});

// ── 스크롤 새로고침 방지 (pull-to-refresh) ──
let touchStartY = 0;
document.addEventListener('touchstart', function(e) {
  touchStartY = e.touches[0].clientY;
}, { passive: false });
document.addEventListener('touchmove', function(e) {
  const touchY = e.touches[0].clientY;
  const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
  if (scrollTop === 0 && touchY > touchStartY) {
    e.preventDefault();
  }
}, { passive: false });

function startSurvey() {
  document.getElementById('coverScreen').style.display = 'none';
  document.getElementById('surveyScreen').style.display = 'block';
  renderPage();
  window.scrollTo(0,0);
}

function renderPage() {
  const start = currentPage * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, QUESTIONS.length);
  const pageQs = QUESTIONS.slice(start, end);
  const valueNames = [...new Set(pageQs.map(q => VALUES.find(v => v.id === q.vid).name))];
  document.getElementById('sectionChip').textContent = valueNames.join(' · ');
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  pageQs.forEach((q, i) => {
    const qIdx = start + i;
    const block = document.createElement('div');
    block.className = 'question-block' + (answers[qIdx] ? ' answered' : '');
    block.id = 'qblock-' + qIdx;
    block.innerHTML = `<div class="q-num">Q${qIdx+1}</div>
      <div class="q-text">${q.q}</div>
      <div class="likert-row">${LABELS.map((l,li) => `<button class="likert-btn${answers[qIdx]===li+1?' selected':''}" onclick="selectAnswer(${qIdx},${li+1})">${l}</button>`).join('')}</div>`;
    container.appendChild(block);
  });
  const pct = Math.round((currentPage / TOTAL_PAGES) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${currentPage+1} / ${TOTAL_PAGES} 페이지`;
  document.getElementById('prevBtn').disabled = currentPage === 0;
  updateNextBtn();
}

function selectAnswer(qIdx, val) {
  answers[qIdx] = val;
  const block = document.getElementById('qblock-' + qIdx);
  if (block) {
    block.classList.add('answered');
    block.querySelectorAll('.likert-btn').forEach((b,i) => b.classList.toggle('selected', i+1===val));
  }
  updateNextBtn();
}

function updateNextBtn() {
  const start = currentPage * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, QUESTIONS.length);
  let all = true;
  for (let i = start; i < end; i++) { if (!answers[i]) { all = false; break; } }
  const btn = document.getElementById('nextBtn');
  btn.textContent = currentPage === TOTAL_PAGES-1 ? '결과 보기 →' : '다음';
  btn.disabled = !all;
}

function changePage(dir) {
  if (dir===1 && currentPage===TOTAL_PAGES-1) { showResult(); return; }
  currentPage = Math.max(0, Math.min(TOTAL_PAGES-1, currentPage+dir));
  renderPage();
  window.scrollTo(0,0);
}

function calcScores() {
  const scores = {};
  VALUES.forEach(v => { scores[v.id] = 0; });
  QUESTIONS.forEach((q,i) => { if (answers[i]) scores[q.vid] += answers[i]; });
  return scores;
}

function switchTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach((btn,i) => {
    const ids = ['myResult','guide'];
    btn.classList.toggle('active', ids[i] === tabId);
  });
  document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
  document.getElementById('tab-' + tabId).classList.add('active');
  window.scrollTo(0,0);
}

function toggleValueCard(idx) {
  const body = document.getElementById('vc-body-' + idx);
  const arrow = document.getElementById('vc-arrow-' + idx);
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

function toggleTypeCard(typeKey) {
  const body = document.getElementById('tg-body-' + typeKey);
  const arrow = document.getElementById('tg-arrow-' + typeKey);
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

function toggleMoreJobs(typeKey) {
  const hidden = document.getElementById('hidden-' + typeKey);
  const btn = document.getElementById('morebtn-' + typeKey);
  if (hidden.style.display === 'none') {
    hidden.style.display = 'flex';
    btn.textContent = '접기 ▲';
  } else {
    hidden.style.display = 'none';
    btn.textContent = `+${TYPE_JOBS[typeKey].length - SHOW_LIMIT}개 더보기 ▼`;
  }
}

function showResult() {
  const scores = calcScores();
  const sorted = VALUES.slice().sort((a,b) => scores[b.id]-scores[a.id]);
  const top3ids = sorted.slice(0,3).map(v=>v.id);

  document.getElementById('surveyScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  // Top3
  document.getElementById('top3Grid').innerHTML = sorted.slice(0,3).map((v,i) => `
    <div class="top3-card${i===0?' rank1':''}">
      <div class="rank-badge">${['1순위','2순위','3순위'][i]}</div>
      <div class="rank-name">${v.name}</div>
      <div class="rank-score">${scores[v.id]}</div>
    </div>`).join('');

  // All scores
  document.getElementById('allScores').innerHTML = sorted.map(v => {
    const isTop = top3ids.includes(v.id);
    const pct = Math.round((scores[v.id]/20)*100);
    return `<div class="score-row">
      <span class="score-label">${v.name}</span>
      <div class="score-bar-wrap"><div class="score-bar-fill${isTop?' top':''}" style="width:${pct}%"></div></div>
      <span class="score-num">${scores[v.id]}</span>
    </div>`;
  }).join('');

  // My type
  const typeTotals = {stable:0,meaning:0,change:0,achieve:0};
  VALUES.forEach(v => { typeTotals[v.type] += scores[v.id]; });
  const topType = Object.keys(typeTotals).sort((a,b)=>typeTotals[b]-typeTotals[a])[0];
  const t = TYPES[topType];
  document.getElementById('myTypeCard').innerHTML = `
    <div class="my-type-header">
      <div class="my-type-row"><span class="my-type-label">나의 가치지향 유형</span><span class="my-type-name">${t.name}</span></div>
      <p class="my-type-desc">${t.desc}</p>
    </div>
    <div class="my-type-pills">${t.keys.map(k=>`<span class="type-pill">${k}</span>`).join('')}</div>
    <div class="perspective-block">
      <div class="perspective-label">이 유형이 직업을 바라보는 관점 (예시)</div>
      ${t.perspectives.map(p=>`<div class="perspective-item"><div class="perspective-job">${p.job}</div><div class="perspective-text">${p.text}</div></div>`).join('')}
    </div>`;

  // Tab2: 가치관 카드
  document.getElementById('valueCards').innerHTML = VALUES.map((v,idx) => `
    <div class="value-card">
      <div class="value-card-toggle" onclick="toggleValueCard(${idx})">
        <span class="value-card-name">${v.name}</span>
        <span class="value-card-arrow" id="vc-arrow-${idx}">▼</span>
      </div>
      <div class="value-card-body" id="vc-body-${idx}">
        <div class="value-card-def">${v.def}</div>
        <div class="value-card-desc">${v.desc}</div>
      </div>
    </div>`).join('');

  // Tab2: 유형 가이드
  const typeOrder = ['stable','meaning','change','achieve'];
  document.getElementById('typeGuideCards').innerHTML = typeOrder.map(typeKey => {
    const t = TYPES[typeKey];
    const jobs = TYPE_JOBS[typeKey];
    const shown = jobs.slice(0, SHOW_LIMIT);
    const hidden = jobs.slice(SHOW_LIMIT);
    const hasMore = hidden.length > 0;
    return `<div class="type-guide-card">
      <div class="type-guide-toggle" onclick="toggleTypeCard('${typeKey}')">
        <div class="type-guide-toggle-left">
          <div class="type-guide-name">${t.name}</div>
          <div class="type-guide-keys">${t.keys.map(k=>`<span class="type-guide-key">${k}</span>`).join('')}</div>
        </div>
        <span class="type-guide-toggle-arrow" id="tg-arrow-${typeKey}">▼</span>
      </div>
      <div class="type-guide-body-wrap" id="tg-body-${typeKey}">
        <div style="padding: 1rem 1.5rem; border-top: 1px solid var(--border); background: var(--accent-light);">
          <p class="type-guide-desc">${t.desc}</p>
        </div>
        <div class="type-guide-body">
          <div class="type-jobs-label">관련 직업</div>
          <div class="job-tags">
            ${shown.map(j=>`<span class="job-tag">${j}</span>`).join('')}
            ${hasMore ? `<div id="hidden-${typeKey}" class="job-tags jobs-hidden" style="display:none;flex-wrap:wrap;gap:6px;width:100%;margin-top:0;">${hidden.map(j=>`<span class="job-tag">${j}</span>`).join('')}</div>` : ''}
          </div>
          ${hasMore ? `<button class="job-tag-more" id="morebtn-${typeKey}" onclick="event.stopPropagation();toggleMoreJobs('${typeKey}')" style="margin-top:8px;">+${hidden.length}개 더보기 ▼</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  window.scrollTo(0,0);
}

function resetSurvey() {
  answers = {};
  currentPage = 0;
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('coverScreen').style.display = 'flex';
  window.scrollTo(0,0);
}
</script>
</body>
</html>
